name: Generate and Publish Github Release CSV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Runs at minute 0 of every hour (UTC)

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run CSV Generation Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUBRELEASECSVURL: ${{ vars.GITHUBRELEASECSVURL }}
          GITHUBRELEASECSVGID: ${{ vars.GITHUBRELEASECSVGID }}
          EMU68IMAGERVERSION: ${{ vars.EMU68IMAGERVERSION }}            
        shell: pwsh
        run: |
          ./.config/GenerateGithubReleaseCSV.ps1

      - name: Upload file to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: GithubReleaseCSV
          name: "Github CSV Latest Release"
          body: "Automated daily export of tracked Amiga GitHub release assets."
          files: dist/SoftwareReleases.csv
          draft: false